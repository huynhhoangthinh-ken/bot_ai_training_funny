<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Đại Chúng Properties | Trợ Lý Hổ AI Thông Minh</title>
  <meta name="description" content="Trợ lý AI Đào Tạo & Chốt Deal Bất Động Sản Đại Chúng Properties">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐯</text></svg>">
</head>
<body>

  <div class="app-root-container">
    <!-- =========================================================================
         1. TOP HEADER (LOGO | ĐẠI CHÚNG PROPERTIES | CHẾ ĐỘ | TÍNH CÁCH)
         ========================================================================= -->
    <header class="app-header">
      <div class="header-inner">
        <!-- Logo & Brand Name -->
        <div class="brand-group" id="brandLogoWrap" title="Bất Động Sản Đại Chúng Properties">
          <div class="brand-logo-box" id="brandLogoBox">
            <span class="logo-text-emblem">ĐC</span>
          </div>
          <div class="brand-text">
            <h1 id="brandNameHeader">ĐẠI CHÚNG PROPERTIES</h1>
          </div>
        </div>

        <!-- Selectors: Chế độ AI & Tính cách -->
        <div class="header-controls">
          <!-- Chế độ AI Selector -->
          <div class="compact-select-wrap">
            <select id="aiModeSelect" class="compact-dropdown" title="Chọn Chế độ AI">
              <option value="deepseek-chat" selected>⚡ Phản hồi nhanh</option>
              <option value="deepseek-reasoner">🧠 Suy luận sâu</option>
            </select>
          </div>

          <!-- Tính cách Selector -->
          <div class="compact-select-wrap">
            <select id="personalitySelect" class="compact-dropdown" title="Chọn Tính cách của Hổ">
              <option value="hai_huoc" selected>🐯 Hổ Hài Hước</option>
              <option value="master_sales">👑 Sát Thủ Chốt Deal</option>
              <option value="cute_dongvien">✨ Cute Động Viên</option>
              <option value="triet_ly">🧘 Triết Lý Bác Học</option>
            </select>
          </div>

          <!-- Clear Chat & Quiz -->
          <button class="btn-ctrl-gold" id="openQuizModalBtn" title="Trắc nghiệm đo EQ Sales">
            <span>🎮 Test EQ</span>
          </button>

          <button class="btn-ctrl-icon" id="clearChatBtn" title="Xóa lịch sử chat">
            🗑️
          </button>
        </div>
      </div>
    </header>

    <!-- =========================================================================
         2. MAIN CHAT FEED (CHIẾM TRỌN 80% - 85% MÀN HÌNH)
         ========================================================================= -->
    <main class="chat-main-layout">
      <div class="chat-container">
        <div class="chat-messages-container" id="chatFeed">
          <!-- Initial messages dynamically injected by chat.js -->
        </div>
      </div>
    </main>

    <!-- =========================================================================
         3. BOTTOM ACTION BAR (3 NÚT NHƯ BẢN VẼ: BÓI QUẺ | NĂNG LƯỢNG | HÔM NAY MUA GÌ)
         ========================================================================= -->
    <div class="bottom-action-grid">
      <button class="action-tab-btn" data-text="Bói cho tôi 1 quẻ may mắn chốt cọc tháng này!">
        <span class="tab-icon">🔮</span>
        <span class="tab-title">Bói quẻ chốt cọc</span>
      </button>
      <button class="action-tab-btn" data-text="Truyền cho tôi 1 liều năng lượng chốt deal thần tốc và bí quyết đối đáp khách giàu!">
        <span class="tab-icon">🔥</span>
        <span class="tab-title">Năng lượng chốt deal</span>
      </button>
      <button class="action-tab-btn" data-text="Hôm nay có dự án nào hot nhất của Đại Chúng (Blanca City, Sola The Global City, Urban Green...) nên tư vấn cho khách?">
        <span class="tab-icon">🛒</span>
        <span class="tab-title">Hôm nay mua gì?</span>
      </button>
    </div>

    <!-- =========================================================================
         4. CHAT INPUT BAR
         ========================================================================= -->
    <footer class="app-chat-footer">
      <div class="chat-input-wrapper">
        <textarea id="chatInputArea" class="chat-textarea" placeholder="Nhắn tin với Cọp AI hoặc bấm micro để nói..." rows="1"></textarea>
        <button id="voiceInputBtn" class="chat-voice-btn" title="Nói bằng giọng nói Tiếng Việt">
          <span class="mic-icon">🎙️</span>
        </button>
        <button id="sendMsgBtn" class="chat-send-action-btn" title="Gửi tin nhắn">
          <span>GỬI</span> ➔
        </button>
      </div>
    </footer>
  </div>

  <!-- =========================================================================
       MODAL: TRẮC NGHIỆM ĐO EQ & BÓI TÍNH CÁCH SALES BĐS
       ========================================================================= -->
  <div class="modal-backdrop" id="quizModal">
    <div class="modal-card" style="max-width: 640px;">
      <div class="modal-header" style="background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 100%); border-bottom: 1.5px solid #f472b6;">
        <div class="modal-title">
          <span style="font-size: 1.6rem;">🎮</span>
          <div>
            <h3 style="color: #9d174d;">TRẮC NGHIỆM TÍNH CÁCH & ĐO EQ SALES BĐS</h3>
            <p>Khám phá bạn là hệ chiến binh nào trong làng chốt deal Đại Chúng!</p>
          </div>
        </div>
        <button class="modal-close-btn" id="closeQuizModalBtn">✕</button>
      </div>

      <div class="modal-body" id="quizModalBody">
        <!-- Content dynamically rendered by js/quiz.js -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Javascript Modules -->
  <script src="js/data.js"></script>
  <script src="js/project_database.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
